version: '3.8'
services:
  surrogate-api:
    build: .
    ports: ["8000:8000"]
    environment:
      - MODEL_PATH=/models/production/lightgbm_production.joblib
  cfd-dispatcher:
    image: alpine:latest
    command: tail -f /dev/null
    volumes: ["./data/cfd_cases:/data"]
  frontend:
    image: nginx:alpine
    ports: ["80:80"]
  db:
    image: postgis/postgis
    environment:
      - POSTGRES_PASSWORD=postgres
