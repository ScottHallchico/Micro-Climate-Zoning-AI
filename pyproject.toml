[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microclimate-zoning-ai"
version = "0.1.0"
description = "Five-phase pipeline transforming urban sensor data into physics-grounded, block-level zoning legislation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MicroCLimate Team"},
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.2",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "geoalchemy2>=0.14.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "jsonschema>=4.20.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.92.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
geo = [
    "pdal>=3.2.0",
    "open3d>=0.18.0",
    "rasterio>=1.3.0",
]
ml = [
    "botorch>=0.9.0",
    "gpytorch>=1.11.0",
    "deepxde>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
